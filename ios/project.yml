name: ShalomMail
options:
  bundleIdPrefix: com.shalomail
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-BR
settings:
  base:
    DEVELOPMENT_TEAM: 2UNWMDD93S
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  Sodium:
    url: https://github.com/jedisct1/swift-sodium
    from: 0.9.1
  BigInt:
    url: https://github.com/attaswift/BigInt
    from: 5.4.0
targets:
  ShalomMail:
    type: application
    platform: iOS
    sources:
      - path: ShalomMail
    dependencies:
      - package: Sodium
      - package: BigInt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shalomail.app
        PRODUCT_NAME: ShalomMail
        INFOPLIST_KEY_CFBundleDisplayName: Shalom Mail
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ShalomMail/ShalomMail.entitlements
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSFaceIDUsageDescription: "O Face ID abre a chave que destranca os seus e-mails neste iPhone."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Para salvar na Fototeca as imagens que você escolher de um e-mail."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Support/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
      # A de teste aceita o Worker local (127.0.0.1) e o esquema shalommail://; a da loja, não.
      configs:
        Debug:
          INFOPLIST_FILE: Support/Info-Debug.plist
  ShalomMailTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ShalomMailTests
    dependencies:
      - target: ShalomMail
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shalomail.app.tests
        GENERATE_INFOPLIST_FILE: YES
  ShalomMailUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ShalomMailUITests
    dependencies:
      - target: ShalomMail
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shalomail.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ShalomMail
schemes:
  ShalomMail:
    build:
      targets:
        ShalomMail: all
        ShalomMailTests: [test]
        ShalomMailUITests: [test]
    test:
      targets:
        - ShalomMailTests
        - ShalomMailUITests
